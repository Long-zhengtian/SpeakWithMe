<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Speak With Me</title>
    <script>
      (function () {
        var forced = new URLSearchParams(location.search).has("phone");
        var media = window.matchMedia("(max-width: 860px)");
        function apply() {
          document.documentElement.classList.toggle("is-phone", forced || media.matches);
          document.documentElement.classList.toggle("force-phone", forced);
        }
        apply();
        media.addEventListener("change", apply);
      })();
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f4a3c'/%3E%3Ccircle cx='10' cy='16' r='2.2' fill='%23f3ecdf'/%3E%3Ccircle cx='16' cy='16' r='2.2' fill='%23e7b089'/%3E%3Ccircle cx='22' cy='16' r='2.2' fill='%23f3ecdf'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
